name: Export source ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create source archive
        run: git archive --format=zip --output=Note-Note-completo-main.zip HEAD
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: Note-Note-completo-main
          path: Note-Note-completo-main.zip
          if-no-files-found: error
          retention-days: 1
