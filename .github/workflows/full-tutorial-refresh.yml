name: Full Tutorial Refresh
on:
  push:
    branches: [fix/full-tutorial-refresh-2026-09-01]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-tutorial-refresh-2026-09-01
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python .github/scripts/update_full_tutorial.py
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Commit changes
        run: |
          rm -f .github/workflows/full-tutorial-refresh.yml .github/scripts/update_full_tutorial.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "docs: teach all current Note Note features [skip ci]"
          git push origin HEAD:fix/full-tutorial-refresh-2026-09-01
