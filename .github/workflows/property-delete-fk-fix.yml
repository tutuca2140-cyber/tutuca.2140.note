name: Property Delete FK Fix
on:
  push:
    branches: [fix/property-delete-fk-2026-09-01]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/property-delete-fk-2026-09-01
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch property deletion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/properties-v2.ts')
          t=p.read_text()
          old='''    if(action==="delete_property"){\n      requirePerm(user,"canDelete");const id=Math.trunc(num(body.id));const linked=await sql`SELECT (SELECT COUNT(*) FROM property_rentals WHERE "propertyId"=${id} AND status='ativo')::int rentals,(SELECT COUNT(*) FROM property_financings WHERE "propertyId"=${id} AND status='ativo')::int financings`;if(Number((linked[0] as any)?.rentals)>0||Number((linked[0] as any)?.financings)>0)return sendJson(res,409,{success:false,message:"Encerre o aluguel ou financiamento ativo antes de excluir o imóvel."});await sql`DELETE FROM properties WHERE id=${id} AND "databaseId"=${databaseId}`;return sendJson(res,200,{success:true});\n    }'''
          new='''    if(action==="delete_property"){\n      requirePerm(user,"canDelete");\n      const id=Math.trunc(num(body.id));\n      const propRows=await sql`SELECT id,title FROM properties WHERE id=${id} AND "databaseId"=${databaseId} LIMIT 1`;\n      if(!propRows[0])return sendJson(res,404,{success:false,message:"Imóvel não encontrado."});\n      const linked=await sql`SELECT\n        (SELECT COUNT(*) FROM property_rentals WHERE "propertyId"=${id} AND status='ativo')::int rentals,\n        (SELECT COUNT(*) FROM property_financings WHERE "propertyId"=${id} AND status='ativo')::int financings,\n        (SELECT COUNT(*) FROM property_rentals WHERE "propertyId"=${id})::int all_rentals,\n        (SELECT COUNT(*) FROM property_financings WHERE "propertyId"=${id})::int all_financings,\n        (SELECT COUNT(*) FROM property_sales WHERE "propertyId"=${id})::int all_sales`;\n      const refs=linked[0] as any;\n      if(Number(refs?.rentals)>0||Number(refs?.financings)>0)return sendJson(res,409,{success:false,message:"Encerre o aluguel ou financiamento ativo antes de excluir o imóvel."});\n      const hasHistory=Number(refs?.all_rentals)>0||Number(refs?.all_financings)>0||Number(refs?.all_sales)>0;\n      if(hasHistory&&user.role!=="super_admin")return sendJson(res,409,{success:false,message:"Este imóvel possui histórico de aluguel, financiamento ou venda. Somente o Super Admin pode excluí-lo definitivamente."});\n      if(user.role==="super_admin"&&hasHistory){\n        const cashRows=await sql`SELECT "cashFlowId" FROM property_rental_payments WHERE "rentalId" IN (SELECT id FROM property_rentals WHERE "propertyId"=${id}) UNION ALL SELECT "cashFlowId" FROM property_financing_payments WHERE "financingId" IN (SELECT id FROM property_financings WHERE "propertyId"=${id}) UNION ALL SELECT "cashFlowId" FROM property_sales WHERE "propertyId"=${id}`;\n        for(const row of cashRows as any[]){const cashId=Number(row.cashFlowId||0);if(cashId>0)await sql`DELETE FROM cash_flow WHERE id=${cashId} AND "databaseId"=${databaseId}`;}\n        await sql`DELETE FROM property_rental_payments WHERE "rentalId" IN (SELECT id FROM property_rentals WHERE "propertyId"=${id})`;\n        await sql`DELETE FROM property_financing_payments WHERE "financingId" IN (SELECT id FROM property_financings WHERE "propertyId"=${id})`;\n        await sql`DELETE FROM property_rentals WHERE "propertyId"=${id}`;\n        await sql`DELETE FROM property_financings WHERE "propertyId"=${id}`;\n        await sql`DELETE FROM property_sales WHERE "propertyId"=${id}`;\n      }\n      await sql`DELETE FROM properties WHERE id=${id} AND "databaseId"=${databaseId}`;\n      return sendJson(res,200,{success:true});\n    }'''
          if old not in t: raise SystemExit('delete_property snippet not found')
          p.write_text(t.replace(old,new,1))
          PY
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Commit changes
        run: |
          rm -f .github/workflows/property-delete-fk-fix.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "fix: safely delete properties with historical references [skip ci]"
          git push origin HEAD:fix/property-delete-fk-2026-09-01
