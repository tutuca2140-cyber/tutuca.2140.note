name: Product Inventory Update
on:
  push:
    branches:
      - fix/product-inventory-2026-09-01
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/product-inventory-2026-09-01
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply changes
        run: python .github/scripts/product_inventory_update.py
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Commit changes
        run: |
          rm -f .github/workflows/product-inventory-update.yml .github/scripts/product_inventory_update.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "feat: add product color and stock measurement [skip ci]"
          git push origin HEAD:fix/product-inventory-2026-09-01
