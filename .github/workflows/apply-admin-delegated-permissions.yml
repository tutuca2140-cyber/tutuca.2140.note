name: Apply Admin Delegated Permissions
on:
  push:
    branches: ["feat/admin-delegated-permissions-2026-09-01"]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: python .github/scripts/patch-auth-me-admin-permissions.py
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add api/auth/me.ts server/routers.ts
          git commit -m "fix: expose and enforce delegated admin permissions [skip ci]" || exit 0
          git push
