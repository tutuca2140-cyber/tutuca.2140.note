name: Apply Support UI
on:
  push:
    paths:
      - '.github/workflows/apply-support-ui.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python .github/scripts/apply-support-ui.py
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Commit support UI
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add client/src/pages/Tutorial.tsx client/src/App.tsx client/src/components/DashboardLayout.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add support chat to tutorial and admin [skip ci]"
          git push origin HEAD:main
