name: Fix User Create
on:
  push:
    branches: [fix/super-admin-user-create-2026-09-01]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/super-admin-user-create-2026-09-01
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply fix
        shell: python
        run: |
          from pathlib import Path
          p=Path('server/routers.ts'); s=p.read_text()
          old='email: z.string().trim().email(),\n          name: z.string().trim().min(1).max(200),\n          password: z.string().min(6),'
          new='email: z.union([z.string().trim().email(), z.literal("")]).default(""),\n          name: z.string().trim().min(1).max(200),\n          password: z.string().min(6),'
          if old not in s: raise SystemExit('create email schema marker not found')
          s=s.replace(old,new,1)
          old='if (await db.getUserByEmail(input.email)) {\n          throw new TRPCError({\n            code: "CONFLICT",\n            message: "E-mail já cadastrado.",\n          });\n        }'
          new='if (input.email && await db.getUserByEmail(input.email)) {\n          throw new TRPCError({\n            code: "CONFLICT",\n            message: "E-mail já cadastrado.",\n          });\n        }'
          if old not in s: raise SystemExit('email conflict marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('server/db.ts'); s=p.read_text()
          old='email: string;\n  name: string;\n  passwordHash: string;'
          new='email?: string;\n  name: string;\n  passwordHash: string;'
          if old not in s: raise SystemExit('db email type marker not found')
          s=s.replace(old,new,1)
          old='email: data.email,\n      name: data.name,'
          new='email: data.email?.trim() || null,\n      name: data.name,'
          if old not in s: raise SystemExit('db insert email marker not found')
          s=s.replace(old,new,1)
          old='dashboardOnly?: boolean;\n}): Promise<any> {'
          new='dashboardOnly?: boolean;\n  adminCanControlPanel?: boolean;\n  adminCanSubscriptions?: boolean;\n  adminCanMarketing?: boolean;\n  adminCanSupport?: boolean;\n  adminCanUsers?: boolean;\n  adminCanDatabases?: boolean;\n  adminCanAudit?: boolean;\n}): Promise<any> {'
          if old not in s: raise SystemExit('admin permission type marker not found')
          s=s.replace(old,new,1)
          old='dashboardOnly: data.dashboardOnly ?? false,\n      isActive: true,'
          new='dashboardOnly: data.dashboardOnly ?? false,\n      adminCanControlPanel: data.adminCanControlPanel ?? false,\n      adminCanSubscriptions: data.adminCanSubscriptions ?? false,\n      adminCanMarketing: data.adminCanMarketing ?? false,\n      adminCanSupport: data.adminCanSupport ?? false,\n      adminCanUsers: data.adminCanUsers ?? false,\n      adminCanDatabases: data.adminCanDatabases ?? false,\n      adminCanAudit: data.adminCanAudit ?? false,\n      isActive: true,'
          if old not in s: raise SystemExit('admin permission insert marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('client/src/pages/admin/Usuarios.tsx'); s=p.read_text()
          old='<Label htmlFor="user-email">E-mail</Label>'
          new='<Label htmlFor="user-email">E-mail <span className="text-xs font-normal text-muted-foreground">(opcional)</span></Label>'
          if old not in s: raise SystemExit('ui label marker not found')
          s=s.replace(old,new,1)
          old='<Input id="user-email" className="mt-2" type="email" autoCapitalize="none" value={draft.email} onChange={e => setDraft({ ...draft, email: e.target.value })} />'
          new='<Input id="user-email" className="mt-2" type="email" autoCapitalize="none" value={draft.email} onChange={e => setDraft({ ...draft, email: e.target.value })} placeholder="usuario@exemplo.com" />\n                      <p className="mt-1 text-xs text-muted-foreground">Pode deixar em branco para usuários internos de equipe.</p>'
          if old not in s: raise SystemExit('ui email marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Commit tested fix
        run: |
          rm .github/workflows/fix-user-create.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add server/routers.ts server/db.ts client/src/pages/admin/Usuarios.tsx .github/workflows/fix-user-create.yml
          git commit -m "fix: allow super admin to create team users [skip ci]"
          git push origin HEAD:fix/super-admin-user-create-2026-09-01
