name: Payment Resume Fix
on:
  push:
    branches: [fix/payment-resume-and-financing-delete-2026-09-01]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payment-resume-and-financing-delete-2026-09-01
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); t=p.read_text()
              if old not in t: raise SystemExit(f'Expected snippet not found: {path}')
              p.write_text(t.replace(old,new,1))
          rep('api/auth/register-commercial.ts','    const initialAccessActive = billingMethod === "card_monthly";\n    const subscriptionTrialEndsAt = initialAccessActive ? trialEndsAt.toISOString() : null;','    const initialAccessActive = false;\n    const subscriptionTrialEndsAt = billingMethod === "card_monthly" ? trialEndsAt.toISOString() : null;')
          rep('api/auth/register-commercial.ts','        status: "active", trialDays: TRIAL_DAYS, trialEndsAt: trialEndsAt.toISOString(), marketingOptIn,','        status: "pending_payment", trialDays: TRIAL_DAYS, trialEndsAt: trialEndsAt.toISOString(), marketingOptIn,')
          rep('api/auth/register-commercial.ts','        status: "active", trialDays: TRIAL_DAYS, trialEndsAt: trialEndsAt.toISOString(), marketingOptIn,','        status: "pending_payment", trialDays: TRIAL_DAYS, trialEndsAt: trialEndsAt.toISOString(), marketingOptIn,')
          rep('server/asaas-webhook.ts','  const inactive = event === "SUBSCRIPTION_INACTIVATED" || event === "SUBSCRIPTION_DELETED";\n  const nextStatus = inactive ? (trialActive ? "active" : "canceled") : String(row.status || "active");','  const inactive = event === "SUBSCRIPTION_INACTIVATED" || event === "SUBSCRIPTION_DELETED";\n  const cardSetupCompleted = !inactive && String(row.billingMethod) === "card_monthly" && Boolean(subscriptionId);\n  const nextStatus = inactive ? (trialActive ? "active" : "canceled") : cardSetupCompleted ? "active" : String(row.status || "pending_payment");')
          rep('api/auth/login.ts','    if (!user.isActive) {\n      return sendJson(res, 403, {\n        success: false,\n        message: "Usuário desativado.",\n      });\n    }','''    if (!user.isActive) {\n      if (user.loginMethod === "commercial_signup") {\n        const pendingRows = await sql`SELECT plan,status,"billingMethod","checkoutUrl","providerStatus","pixQrCode","pixQrCodeBase64","pixExpiresAt","trialEndsAt" FROM commercial_subscriptions WHERE "userId"=${user.id} LIMIT 1`;\n        const pending = pendingRows[0] as any;\n        if (pending && ["active", "paid"].includes(String(pending.status))) { await sql`UPDATE users SET "isActive"=true,"updatedAt"=NOW() WHERE id=${user.id}`; user.isActive=true; }\n        else if (pending) return sendJson(res,402,{success:false,paymentPending:true,message:"Seu cadastro foi encontrado. Conclua a etapa de pagamento para liberar o primeiro acesso.",payment:{plan:pending.plan,status:pending.status,billingMethod:pending.billingMethod,checkoutUrl:pending.checkoutUrl,providerStatus:pending.providerStatus,pixQrCode:pending.pixQrCode,pixQrCodeBase64:pending.pixQrCodeBase64,pixExpiresAt:pending.pixExpiresAt,trialEndsAt:pending.trialEndsAt}});\n      }\n      if (!user.isActive) return sendJson(res,403,{success:false,message:"Usuário desativado."});\n    }''')
          old='''    if(action==="delete_financing"){\n      requirePerm(user,"canDelete");const financingId=Math.trunc(num(body.financingId));const rows=await sql`SELECT id,"propertyId","downPayment",status FROM property_financings WHERE id=${financingId} AND "databaseId"=${databaseId} LIMIT 1`;const f=rows[0] as any;if(!f)return sendJson(res,404,{success:false,message:"Financiamento não encontrado."});const paid=await sql`SELECT COUNT(*)::int AS total FROM property_financing_payments WHERE "financingId"=${financingId}`;if(Number(f.downPayment||0)>0||Number((paid[0] as any)?.total||0)>0)return sendJson(res,409,{success:false,message:"Este financiamento possui movimentação financeira. Cancele-o para preservar o histórico; a exclusão só é permitida quando não há entrada nem parcelas pagas."});await sql`DELETE FROM property_financings WHERE id=${financingId} AND "databaseId"=${databaseId}`;if(String(f.status)!=="pago")await sql`UPDATE properties SET status='disponivel',"updatedAt"=NOW() WHERE id=${Number(f.propertyId)} AND "databaseId"=${databaseId}`;return sendJson(res,200,{success:true});\n    }'''
          new='''    if(action==="delete_financing"){\n      requirePerm(user,"canDelete");const financingId=Math.trunc(num(body.financingId));const rows=await sql`SELECT f.id,f."propertyId",f."clientId",f."downPayment",f.status,f."createdBy",f."createdAt",p.title AS "propertyTitle" FROM property_financings f JOIN properties p ON p.id=f."propertyId" WHERE f.id=${financingId} AND f."databaseId"=${databaseId} LIMIT 1`;const f=rows[0] as any;if(!f)return sendJson(res,404,{success:false,message:"Financiamento não encontrado."});const paymentRows=await sql`SELECT "cashFlowId" FROM property_financing_payments WHERE "financingId"=${financingId}`;const hasFinancialMovement=Number(f.downPayment||0)>0||paymentRows.length>0;if(hasFinancialMovement&&user.role!=="super_admin")return sendJson(res,409,{success:false,message:"Este financiamento possui movimentação financeira. Somente o Super Admin pode excluí-lo definitivamente; você pode cancelá-lo para preservar o histórico."});if(user.role==="super_admin"){for(const row of paymentRows as any[]){const cashId=Number(row.cashFlowId||0);if(cashId>0)await sql`DELETE FROM cash_flow WHERE id=${cashId} AND "databaseId"=${databaseId}`;}if(Number(f.downPayment||0)>0){const desc=`Entrada financiamento - ${String(f.propertyTitle)}`;await sql`DELETE FROM cash_flow WHERE id IN (SELECT id FROM cash_flow WHERE "databaseId"=${databaseId} AND category='ENTRADA_FINANCIAMENTO_IMOVEL' AND description=${desc} AND "clientId"=${Number(f.clientId)} AND amount=${Number(f.downPayment)} AND "createdBy"=${Number(f.createdBy)} ORDER BY ABS(EXTRACT(EPOCH FROM ("movementDate"-${new Date(f.createdAt)}))) ASC LIMIT 1)`;}}await sql`DELETE FROM property_financings WHERE id=${financingId} AND "databaseId"=${databaseId}`;await sql`UPDATE properties SET status='disponivel',"updatedAt"=NOW() WHERE id=${Number(f.propertyId)} AND "databaseId"=${databaseId}`;return sendJson(res,200,{success:true});\n    }'''
          rep('server/properties-v2.ts',old,new)
          p=Path('client/src/pages/Login.tsx'); t=p.read_text()
          t=t.replace('import { CheckCircle2, Loader2, Mail, ShieldCheck } from "lucide-react";','import { CheckCircle2, CreditCard, Loader2, Mail, QrCode, ShieldCheck } from "lucide-react";')
          t=t.replace('  const [captchaAnswer, setCaptchaAnswer] = useState("");','  const [captchaAnswer, setCaptchaAnswer] = useState("");\n  const [pendingPayment, setPendingPayment] = useState<any>(null);')
          t=t.replace('''      const result = await response.json();\n      if (!response.ok || !result?.success) {\n        throw new Error(result?.message || "Usuário ou senha inválidos.");\n      }''','''      const result = await response.json();\n      if (result?.paymentPending) { setPendingPayment(result.payment || {}); toast.info(result?.message || "Conclua o pagamento para liberar o primeiro acesso."); return; }\n      if (!response.ok || !result?.success) { throw new Error(result?.message || "Usuário ou senha inválidos."); }''',1)
          marker='''            ) : (\n              <>\n                <form onSubmit={handleLogin} className="space-y-4">'''
          replacement='''            ) : pendingPayment ? (\n              <div className="space-y-5"><div className="rounded-2xl border border-amber-200 bg-amber-50 p-5 text-center"><div className="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-amber-100 text-amber-700">{pendingPayment.billingMethod === "pix_annual" ? <QrCode className="h-7 w-7" /> : <CreditCard className="h-7 w-7" />}</div><p className="mt-4 text-lg font-black text-slate-900">Continue de onde parou</p><p className="mt-2 text-sm leading-6 text-slate-600">Seu cadastro já está salvo, mas o primeiro acesso só será liberado depois que todas as etapas de pagamento forem concluídas.</p></div><div className="rounded-xl border bg-white p-4 text-sm"><p><strong>Plano:</strong> {String(pendingPayment.plan || "").toUpperCase()}</p><p className="mt-1"><strong>Etapa:</strong> {pendingPayment.billingMethod === "pix_annual" ? "Pagamento anual via Pix" : "Cadastro/validação do cartão"}</p><p className="mt-1"><strong>Status:</strong> {pendingPayment.providerStatus || pendingPayment.status || "Pendente"}</p></div>{pendingPayment.billingMethod === "pix_annual" && pendingPayment.pixQrCodeBase64 ? <img src={`data:image/png;base64,${pendingPayment.pixQrCodeBase64}`} alt="QR Code Pix" className="mx-auto h-56 w-56 rounded-xl border bg-white p-2" /> : null}{pendingPayment.billingMethod === "pix_annual" && pendingPayment.pixQrCode ? <div className="space-y-2"><Label>Código Pix copia e cola</Label><Input readOnly value={pendingPayment.pixQrCode} onFocus={e=>e.currentTarget.select()} /><Button type="button" variant="outline" className="w-full" onClick={()=>navigator.clipboard.writeText(pendingPayment.pixQrCode)}>Copiar código Pix</Button></div> : null}{pendingPayment.checkoutUrl ? <Button type="button" className="w-full" onClick={()=>window.location.href=pendingPayment.checkoutUrl}>{pendingPayment.billingMethod === "pix_annual" ? "Abrir cobrança no Asaas" : "Continuar cadastro do cartão"}</Button> : null}<Button type="button" variant="outline" className="w-full" onClick={()=>{setPendingPayment(null); resetCaptcha();}}>Voltar ao login</Button></div>\n            ) : (\n              <>\n                <form onSubmit={handleLogin} className="space-y-4">'''
          if marker not in t: raise SystemExit('Login render marker not found')
          p.write_text(t.replace(marker,replacement,1))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Commit fixes
        run: |
          rm -f .github/workflows/fix-payment-resume.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "fix: resume pending payment and allow financing deletion [skip ci]"
          git push origin HEAD:fix/payment-resume-and-financing-delete-2026-09-01
