name: Superadmin Commercial DB Isolation
on:
  push:
    branches:
      - fix/superadmin-commercial-db-isolation-2026-09-01
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/superadmin-commercial-db-isolation-2026-09-01
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python .github/scripts/superadmin_commercial_db_isolation.py
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Commit changes
        run: |
          rm -f .github/workflows/superadmin-commercial-db-isolation.yml .github/scripts/superadmin_commercial_db_isolation.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "security: isolate customer databases from operational selector [skip ci]"
          git push origin HEAD:fix/superadmin-commercial-db-isolation-2026-09-01
