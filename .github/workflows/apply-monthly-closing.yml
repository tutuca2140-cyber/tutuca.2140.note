name: Apply Monthly Closing
on: [push]
permissions:
  contents: write
jobs:
  update:
    if: github.ref == 'refs/heads/feat/monthly-closing-2026-09-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/monthly-closing-2026-09-01
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: python .github/scripts/apply-monthly-closing.py
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Commit tested changes
        run: |
          rm -f .github/workflows/apply-monthly-closing.yml .github/scripts/apply-monthly-closing.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "feat: add monthly financial closings [skip ci]"
          git push origin HEAD:feat/monthly-closing-2026-09-01
